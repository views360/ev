<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Subscription Charging Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h1>EV Subscription vs Regular Ad-Hoc Public Charging Comparison</h1>

        <div style="display:flex; gap:10px; align-items: center;">
            <button class="btn secondary" id="themeToggle" onclick="toggleTheme()">Switch to Light View</button>
            <button class="btn secondary" onclick="resetAll()">Reset All</button>
            <a href="https://www.facebook.com/kelvin.a.hill" target="_blank" class="btn secondary">Contact Author</a>
        </div>
    </div>

    <div class="subtitle">
        Compare your usual average public charging costs against various subscription-based provider plans.
    </div>

    <div class="card">
        <div class="grid">
            <div class="input-group">
                <label>Journey distance (miles)</label>
                <input type="number" id="journeyMiles" value="500">
            </div>
            <div class="input-group">
                <label>Vehicle battery (kWh)</label>
                <input type="number" id="batteryKwh" value="77">
            </div>
            <div class="input-group">
                <label>Battery at start (%)</label>
                <input type="number" id="soc" value="100">
            </div>
            <div class="input-group">
                <label>Efficiency (miles/kWh)</label>
                <input type="number" id="efficiency" value="3.5">
            </div>
        </div>
    </div>

    <div class="card">
        <div class="grid">
            <div class="input-group">
                <label>Start charge rate (p/kWh)</label>
                <input type="number" id="startChargeRate" value="7">
            </div>
            <div class="input-group">
                <label>Public Ad-Hoc rate (p/kWh)</label>
                <input type="number" id="adhoc" value="79">
            </div>
            <div class="input-group">
                <label>Minimum charger speed (kW)</label>
                <select id="minSpeed" onchange="filterPresetsBySpeed()">
                    <option value="0">Any speed</option>
                    <option value="7">7kW+</option>
                    <option value="22">22kW+</option>
                    <option value="50">50kW+</option>
                    <option value="150">150kW+</option>
                </select>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
            <h2 style="margin:0; font-size:1rem;">Provider Comparisons</h2>
            <div style="display:flex; gap:8px;">
                <button class="btn primary" onclick="createProviderBox()">+ Add Custom</button>
                <button class="btn primary" onclick="duplicateLastProvider()">Duplicate Last</button>
            </div>
        </div>

        <div id="providers"></div>
    </div>

    <div class="btn-row">
        <button type="button" class="btn secondary" onclick="shareLink()">Copy shareable link</button>
        <button type="button" class="btn secondary" onclick="exportPdf()">Export as PDF</button>
    </div>

    <div id="results" class="results" style="display:none;">
        <div class="input-group" style="max-width:200px; margin-bottom: 15px;">
            <label>Sort results</label>
            <select id="sortResults" onchange="calculate()">
                <option value="cheapest">Cheapest first</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
        </div>

        <div class="calc-lines">
            <div id="preChargeLine"></div>
            <div id="homeRangeLine"></div>
            <div id="publicMilesLine"></div>
            <div id="publicKwhLine"></div>
            <div id="adhocCostLine"></div>
        </div>

        <div id="providerResults"></div>
        <div id="conclusionsBox"></div>
        <div id="summaryBox" class="summary" style="display:none;"></div>

        <div class="chart-wrapper">
            <canvas id="costChart"></canvas>
        </div>
    </div>
</div>

<script src="functions1.js"></script>
<script src="functions2.js"></script>
<script src="functions3.js"></script>
<script src="functions4.js"></script>
</body>
</html>
