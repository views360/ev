<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Subscription Charging Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h1>EV Subscription vs Regular Ad-Hoc Public Charging Comparison</h1>

        <div style="display:flex; gap:10px; align-items: center;">
            <button class="btn secondary" id="themeToggle" onclick="toggleTheme()">Switch to Light View</button>
            <button class="btn secondary" onclick="resetAll()">Reset All</button>
            <a href="https://www.facebook.com/kelvin.a.hill" target="_blank" class="btn secondary">Contact Author</a>
        </div>
    </div>

    <div class="subtitle">
        Compare your usual average public charging rate vs subscriptions that offer discounted rates for a monthly fee.
    </div>

    <div class="grid">
        <div class="panel">
            <h2>Trip & Vehicle</h2>
            <div class="input-row">
                <div class="input-group">
                    <label>Total Journey (miles)</label>
                    <input type="number" id="journeyMiles" value="500">
                </div>
                <div class="input-group">
                    <label>Battery Capacity (kWh)</label>
                    <input type="number" id="batteryKwh" value="77">
                </div>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Start State of Charge (%)</label>
                    <input type="number" id="soc" value="100">
                </div>
                <div class="input-group">
                    <label>Efficiency (mi/kWh)</label>
                    <input type="number" id="efficiency" value="3.5">
                </div>
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Standard Ad-hoc Rate (p/kWh)</label>
                    <input type="number" id="adhoc" value="79">
                </div>
                <div class="input-group">
                    <label>Min. Desired Charging Speed</label>
                    <select id="minSpeed">
                        <option value="0">Any Speed</option>
                        <option value="7">7kW+</option>
                        <option value="22">22kW+</option>
                        <option value="50" selected>50kW+</option>
                        <option value="150">150kW+</option>
                    </select>
                </div>
            </div>
            
            <hr style="margin:20px 0; border:0; border-top:1px solid var(--border);">
            
            <h3>Start Charge Cost</h3>
            <div class="input-row">
                <div class="input-group">
                    <label>Rate (p/kWh)</label>
                    <input type="number" id="startChargeRate" value="7.5">
                </div>
                <div class="input-group">
                    <label>Type</label>
                    <select id="startChargeType">
                        <option value="home">Home Charging</option>
                        <option value="public">Public Charging</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2>Subscriptions & Discounts</h2>
                <div style="display:flex; gap:8px;">
                    <button type="button" class="btn" onclick="addProvider()">+ Add Provider</button>
                    <button type="button" class="btn" onclick="addAllProviders()">Add All Presets</button>
                    <button type="button" class="btn" onclick="duplicateLastProvider()">Duplicate Last</button>
                </div>
            </div>

            <div id="providers"></div>
        </div>
    </div>

    <div class="btn-row">
        <button type="button" class="btn secondary" onclick="shareLink()">Copy shareable link</button>
        <button type="button" class="btn secondary" onclick="exportPdf()">Export as PDF</button>
    </div>

    <div id="results" class="results">
        <div class="input-group" style="max-width:200px;">
            <label>Sort results</label>
            <select id="sortResults" onchange="calculate()">
                <option value="cheapest">Cheapest first</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
        </div>

        <div class="calc-lines">
            <div id="preChargeLine"></div>
            <div id="homeRangeLine"></div>
            <div id="publicMilesLine"></div>
            <div id="publicKwhLine"></div>
            <div id="adhocCostLine"></div>
        </div>

        <div id="providerResults"></div>
        <div id="conclusionsBox"></div>
        <div id="summaryBox" class="summary"></div>

        <div class="chart-wrapper">
            <canvas id="costChart" height="220"></canvas>
        </div>
    </div>
</div>

<script src="functions1.js"></script>
<script src="functions2.js"></script>
<script src="functions3.js"></script>
<script src="functions4.js"></script>
</body>
</html>
