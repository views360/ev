<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Charging Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:15px;">
        <h1>EV Charging Comparison</h1>

        <div style="display:flex; gap:10px; align-items: center;">
            <button class="btn secondary" id="themeToggle" onclick="toggleTheme()">Switch View</button>
            <button class="btn secondary" onclick="resetAll()">Reset</button>
            <a href="https://www.facebook.com/kelvin.a.hill" target="_blank" class="btn secondary">Contact Author</a>
        </div>
    </div>

    <p class="subtitle">Compare subscriptions vs standard ad-hoc charging costs.</p>

    <div class="input-row">
        <div class="input-group">
            <label>Journey Miles</label>
            <input type="number" id="journeyMiles" value="200">
        </div>
        <div class="input-group">
            <label>Battery (kWh)</label>
            <input type="number" id="batteryKwh" value="64">
        </div>
        <div class="input-group">
            <label>Start SoC (%)</label>
            <input type="number" id="soc" value="80">
        </div>
        <div class="input-group">
            <label>Miles/kWh</label>
            <input type="number" id="efficiency" value="3.5" step="0.1">
        </div>
    </div>

    <div class="input-row">
        <div class="input-group">
            <label>Standard Ad-hoc (p)</label>
            <input type="number" id="adhoc" value="79">
        </div>
        <div class="input-group">
            <label>Start Charge Rate (p)</label>
            <input type="number" id="startChargeRate" value="10">
        </div>
        <div class="input-group">
            <label>Required Speed (kW)</label>
            <select id="minSpeed" onchange="enforceSpeedRules()">
                <option value="0">Any Speed</option>
                <option value="7">7kW+ (AC)</option>
                <option value="50">50kW+ (Rapid)</option>
                <option value="150">150kW+ (Ultra)</option>
            </select>
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="addProvider()">+ Add Custom</button>
        <button class="btn" onclick="addAllProviders()">Add All Presets</button>
        <button class="btn secondary" onclick="duplicateLastProvider()">Duplicate Last</button>
    </div>

    <div id="providers"></div>

    <div class="btn-row">
        <button class="btn secondary" onclick="shareLink()">Copy shareable link</button>
        <button class="btn secondary" onclick="exportPdf()">Export as PDF</button>
    </div>

    <div id="results" class="results" style="display:none;">
        <div class="input-group" style="max-width:200px; margin-bottom: 20px;">
            <label>Sort Results</label>
            <select id="sortResults" onchange="calculate()">
                <option value="cheapest">Cheapest first</option>
                <option value="az">A → Z</option>
            </select>
        </div>

        <div id="preChargeLine"></div>
        <div id="providerResults"></div>
        <div id="conclusionsBox"></div>

        <div class="chart-wrapper">
            <canvas id="costChart" height="300"></canvas>
        </div>
    </div>
</div>

<script src="functions1.js"></script>
<script src="functions2.js"></script>
<script src="functions3.js"></script>
<script src="functions4.js"></script>
</body>
</html>
