<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Subscription Charging Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

    <div class="header-row">
        <h1>EV Subscription Charging Comparison</h1>

        <div class="header-buttons">
            <button class="btn secondary" id="themeToggle" onclick="toggleTheme()">Switch to Light View</button>
            <button class="btn secondary" onclick="resetAll()">Reset All</button>
            <a href="https://www.facebook.com/kelvin.a.hill" target="_blank" class="btn secondary">Contact Author</a>
        </div>
    </div>

    <div class="subtitle">
        Compare your usual average public charging rate with subscription discounted charging for a specific trip distance.
    </div>

    <div class="main-grid">
        <div class="panel">
            <h2>1. Journey & Vehicle</h2>
            <div class="input-group">
                <label>Total Trip Miles</label>
                <input type="number" id="journeyMiles" value="300">
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Battery Size (kWh)</label>
                    <input type="number" id="batteryKwh" value="64">
                </div>
                <div class="input-group">
                    <label>Start SoC (%)</label>
                    <input type="number" id="soc" value="100">
                </div>
            </div>
            <div class="input-group">
                <label>Efficiency (miles/kWh)</label>
                <input type="number" id="efficiency" value="3.5">
            </div>

            <h2 style="margin-top:24px;">2. Baseline Costs</h2>
            <div class="input-group">
                <label>Usual Public Rate (p/kWh) - "Ad-hoc"</label>
                <input type="number" id="adhoc" value="79">
            </div>
            <div class="input-row">
                <div class="input-group">
                    <label>Start Charge Rate (p/kWh)</label>
                    <input type="number" id="startChargeRate" value="7">
                </div>
                <div class="input-group">
                    <label>Type</label>
                    <select id="startChargeType">
                        <option value="home">Home</option>
                        <option value="public">Public</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2>3. Comparison Providers</h2>
                <div style="display:flex; gap:8px;">
                    <button class="btn" onclick="createProviderBox()">+ Add Custom</button>
                    <button class="btn" onclick="duplicateLastProvider()">Duplicate Last</button>
                </div>
            </div>

            <div class="input-group" style="margin-bottom:16px;">
                <label>Min. Charger Speed Needed (kW)</label>
                <select id="minSpeed" onchange="enforceSpeedRules()">
                    <option value="0">Any (inc. Slow AC)</option>
                    <option value="22">22kW+ (Accelerated)</option>
                    <option value="50">50kW+ (Rapid)</option>
                    <option value="100">100kW+ (Ultra Rapid)</option>
                    <option value="150">150kW+ (High Power)</option>
                </select>
            </div>

            <div id="providers"></div>
        </div>
    </div>

    <div class="btn-row">
        <button type="button" class="btn secondary" onclick="shareLink()">Copy shareable link</button>
        <button type="button" class="btn secondary" onclick="exportPdf()">Export as PDF</button>
    </div>

    <div id="results" class="results">
        <div class="input-group" style="max-width:200px;">
            <label>Sort results</label>
            <select id="sortResults" onchange="calculate()">
                <option value="cheapest">Cheapest first</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
        </div>

        <div class="calc-lines">
            <div id="preChargeLine"></div>
            <div id="homeRangeLine"></div>
            <div id="publicMilesLine"></div>
            <div id="publicKwhLine"></div>
            <div id="adhocCostLine"></div>
        </div>

        <div id="providerResults"></div>
        <div id="conclusionsBox"></div>
        <div id="summaryBox" class="summary"></div>

        <div class="chart-wrapper">
            <canvas id="costChart" height="220"></canvas>
        </div>
    </div>
</div>

<script src="functions1.js"></script>
<script src="functions2.js"></script>
<script src="functions3.js"></script>
<script src="functions4.js"></script>
</body>
</html>
