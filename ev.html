<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Subscription Charging Comparison</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app">

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h1>EV Subscription Charging Comparison</h1>

        <div style="display:flex; gap:10px; align-items: center;">
            <button class="btn secondary" id="themeToggle" onclick="toggleTheme()">Switch to Light View</button>
            <button class="btn secondary" onclick="resetAll()">Reset All</button>
            <a href="https://www.facebook.com/kelvin.a.hill" target="_blank" class="btn secondary">Contact Author</a>
        </div>
    </div>

    <div class="subtitle">
        Compare your usual average public charging rate with subscription discounted charging for...
    </div>

    <div class="main-grid">
        <div class="card">
            <h2>Trip & Vehicle</h2>
            <div class="input-group">
                <label>Planned journey distance (miles)</label>
                <input type="number" id="journeyMiles" value="500">
            </div>
            <div class="input-group">
                <label>Vehicle battery size (usable kWh)</label>
                <input type="number" id="batteryKwh" value="77">
            </div>
            <div class="input-group">
                <label>Starting state of charge (%)</label>
                <input type="number" id="soc" value="100">
            </div>
            <div class="input-group">
                <label>Real-world efficiency (miles/kWh)</label>
                <input type="number" id="efficiency" value="3.2" step="0.1">
            </div>
            
            <hr style="margin:20px 0; opacity:0.1;">

            <div class="input-group">
                <label>Usual public charging rate (pence/kWh)</label>
                <input type="number" id="adhoc" value="79">
            </div>

            <div class="input-group">
                <label>Pre-journey charging source</label>
                <select id="startChargeType" onchange="updateStartChargeRate()">
                    <option value="home">Home / Cheap (7p)</option>
                    <option value="adhoc">Public / Ad-hoc (79p)</option>
                    <option value="custom">Custom Rate</option>
                </select>
            </div>
            <div class="input-group">
                <label>Pre-journey rate (pence/kWh)</label>
                <input type="number" id="startChargeRate" value="7">
            </div>

            <div class="input-group">
                <label>Minimum desired charging speed</label>
                <select id="minSpeed">
                    <option value="7">7kW (fast)</option>
                    <option value="22">22kW (accelerated)</option>
                    <option value="50" selected>50kW (rapid)</option>
                    <option value="75">75kW (ultra rapid)</option>
                    <option value="150">150kW (high power)</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
                <h2 style="margin:0;">Providers</h2>
                <div style="display:flex; gap:8px;">
                    <button class="btn" onclick="addAllProviders()">Add All</button>
                    <button class="btn" onclick="duplicateLastProvider()">Duplicate Last</button>
                </div>
            </div>

            <div id="providers"></div>
        </div>
    </div>

    <div class="btn-row">
        <button type="button" class="btn secondary" onclick="shareLink()">Copy shareable link</button>
        <button type="button" class="btn secondary" onclick="exportPdf()">Export as PDF</button>
    </div>

    <div id="results" class="results">

        <div class="input-group" style="max-width:200px;">
            <label>Sort results</label>
            <select id="sortResults" onchange="calculate()">
                <option value="cheapest">Cheapest first</option>
                <option value="az">A → Z</option>
                <option value="za">Z → A</option>
            </select>
        </div>

        <div class="calc-lines">
            <div id="preChargeLine"></div>
            <div id="homeRangeLine"></div>
            <div id="publicMilesLine"></div>
            <div id="publicKwhLine"></div>
            <div id="adhocCostLine"></div>
        </div>

        <div id="providerResults"></div>
        
        <div id="conclusionsBox"></div>
        <div id="summaryBox" class="summary"></div>

        <div class="chart-wrapper">
            <canvas id="costChart" height="220"></canvas>
        </div>
    </div>
</div>

<script src="functions1.js"></script>
<script src="functions2.js"></script>
<script src="functions3.js"></script>
<script src="functions4.js"></script>

<script>
    fetch('providers.json')
        .then(response => response.json())
        .then(data => {
            PRESETS = data.providers;
            loadFromLocalStorage();
            if (document.querySelectorAll('.provider-box').length === 0) {
                const urlParams = new URLSearchParams(window.location.search);
                if (!urlParams.has('p0n')) {
                    createProviderBox();
                }
            }
        });

    function updateStartChargeRate() {
        const type = document.getElementById("startChargeType").value;
        const rateInput = document.getElementById("startChargeRate");
        if (type === "home") rateInput.value = 7;
        else if (type === "adhoc") rateInput.value = document.getElementById("adhoc").value;
        calculate();
    }
</script>
</body>
</html>
