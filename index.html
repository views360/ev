<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EV Subs Compare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app">
    <div class="android-header-full">
        <h1 class="android-title-clean">EV Subs Compare (UK)</h1>
        <div class="android-dots-trigger" onclick="toggleMenu()">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div id="sideMenu" class="chrome-style-menu">
        <div class="menu-content">
            <a class="menu-item-clean" onclick="resetAll()">Reset All</a>
        </div>
    </div>

    <div class="input-section">
        <div class="input-group">
            <label>Journey Miles</label>
            <input type="number" id="journeyMiles" value="200" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Battery Size (kWh)</label>
            <input type="number" id="batteryKwh" value="64" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Current SoC (%)</label>
            <input type="number" id="soc" value="100" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Efficiency (mi/kWh)</label>
            <input type="number" id="efficiency" value="3.5" oninput="calculate()">
        </div>
        <div class="input-group">
            <label>Ad-hoc PAYG Rate (p)</label>
            <input type="number" id="adhoc" value="79" oninput="calculate()">
        </div>
        <input type="hidden" id="startChargeRate" value="0">
        <input type="hidden" id="minSpeed" value="0">
    </div>

    <div class="controls">
        <select id="sortResults" onchange="calculate()">
            <option value="cheapest">Cheapest first</option>
            <option value="az">A → Z</option>
        </select>
    </div>

    <div id="providerResults"></div>
    <div class="chart-wrapper">
        <canvas id="costChart"></canvas>
    </div>
</div>
<script src="functions.js"></script>
</body>
</html>
