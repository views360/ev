    <script>
        /* Theme persistence check */
        (function() {
            const getCookie = (name) => {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i].trim();
                    if (c.indexOf(nameEQ) === 0) {
                        try { return JSON.parse(decodeURIComponent(c.substring(nameEQ.length))); } 
                        catch (e) { return decodeURIComponent(c.substring(nameEQ.length)).replace(/"/g, ''); }
                    }
                }
                return null;
            };
            const theme = getCookie('themePref');
            if (theme === 'light') document.documentElement.classList.add('light-mode');
        })();

const form = document.getElementById('form');
const submitBtn = form.querySelector('button[type="submit"]');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const formData = new FormData(form);
    formData.append("access_key", "84becc32-33ce-4060-85b6-28bd955b9836");

    const originalText = submitBtn.textContent;

    submitBtn.textContent = "Sending...";
    submitBtn.disabled = true;

    try {
        const response = await fetch("https://api.web3forms.com/submit", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            alert("Success! Your message has been sent.");
            form.reset();
        } else {
            alert("Error: " + data.message);
        }

    } catch (error) {
        alert("Something went wrong. Please try again.");
    } finally {
        submitBtn.textContent = originalText;
        submitBtn.disabled = false;
    }
});
    </script>

<script>
        // Standalone versions of only the functions needed by this page
        const setCookie = (name, value) => {
            const date = new Date();
            date.setTime(date.getTime() + (30 * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))};expires=${date.toUTCString()};path=/;SameSite=Lax`;
        };

        function toggleTheme() {
            const isLight = document.documentElement.classList.toggle('light-mode');
            setCookie('themePref', isLight ? 'light' : 'dark');
        }

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('sideMenu');
            const trigger = document.querySelector('.android-dots-trigger');
            if (menu.classList.contains('active')) {
                if (!menu.contains(e.target) && !trigger.contains(e.target)) {
                    menu.classList.remove('active');
                }
            }
        });
    </script>
